<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Exuno · CoinW Manual Trading</title>
<style>
:root{
  --bg0:#060912;--card:rgba(20,27,48,.6);--line:rgba(120,150,220,.16);--txt:#eaf0fb;--mut:#8a97ba;--dim:#5d6a8c;
  --buy:#28e0a4;--buy2:#7bffd0;--sell:#ff5d78;--sell2:#ff9bad;--acc:#5b8cff;--gold:#ffcf5b;
  --r:18px;--shadow:0 22px 55px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--txt);min-height:100vh;
  background:radial-gradient(1000px 600px at 85% -10%,rgba(91,140,255,.15),transparent 60%),
  radial-gradient(900px 500px at 5% 110%,rgba(40,224,164,.12),transparent 60%),linear-gradient(160deg,#060912,#0a1020);
  padding:22px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:19px;
  background:linear-gradient(135deg,var(--acc),var(--buy));color:#04121a;box-shadow:0 10px 26px -6px rgba(40,224,164,.5)}
h1{font-size:21px;margin:0;font-weight:800}
.sub{color:var(--mut);font-size:12.5px}
.ticker{display:flex;gap:10px;flex-wrap:wrap}
.chip{font-size:12.5px;color:var(--mut);padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:rgba(10,15,30,.5);font-weight:600;font-variant-numeric:tabular-nums}
.chip b{color:var(--txt)} .chip .g{color:var(--buy)} .chip .r{color:var(--sell)}
.warn{color:var(--gold);font-size:12.5px;padding:10px 14px;border:1px solid rgba(255,207,91,.35);
  background:rgba(255,207,91,.08);border-radius:12px}
.accs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.accs{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card h2{margin:0 0 14px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.badge{font-size:10.5px;font-weight:800;letter-spacing:1px;padding:4px 10px;border-radius:999px;background:rgba(91,140,255,.16);color:var(--acc);border:1px solid rgba(91,140,255,.4)}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.asset{border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(10,15,30,.4)}
.asset .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.asset .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px}
.asset .lk{font-size:10.5px;color:var(--dim);margin-top:3px}
.seg{display:flex;gap:4px;padding:4px;border-radius:11px;background:rgba(6,10,20,.7);border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:800;background:transparent;color:var(--mut);border:none;cursor:pointer;transition:.15s}
.seg button.buy.on{background:linear-gradient(135deg,var(--buy),var(--buy2));color:#04121a}
.seg button.sell.on{background:linear-gradient(135deg,var(--sell),var(--sell2));color:#2a0009}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
input{background:rgba(6,10,20,.75);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font-size:14.5px;outline:none;font-variant-numeric:tabular-nums;font-family:inherit;transition:.15s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,140,255,.18)}
.mini{font-size:11px;color:var(--acc);cursor:pointer;background:none;border:none;padding:0;font-weight:700}
.send{width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;color:#04121a;transition:filter .15s,transform .1s}
.send:active{transform:translateY(1px)}
.send.buy{background:linear-gradient(135deg,var(--buy),var(--buy2))}
.send.sell{background:linear-gradient(135deg,var(--sell),var(--sell2));color:#2a0009}
.send:hover{filter:brightness(1.06)}
.msg{font-size:12px;margin-top:9px;min-height:16px}
.msg.ok{color:var(--buy)} .msg.err{color:var(--sell)}
.ohead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.ohead h3{margin:0;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.cancelall{font-size:11px;font-weight:800;color:var(--sell);background:rgba(255,93,120,.12);border:1px solid rgba(255,93,120,.35);border-radius:8px;padding:6px 11px;cursor:pointer}
.olist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.olist::-webkit-scrollbar{width:7px}.olist::-webkit-scrollbar-thumb{background:rgba(120,150,220,.25);border-radius:7px}
.oitem{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px;font-variant-numeric:tabular-nums}
.oitem:first-child{border-top:none}
.tag{font-weight:800;padding:2px 8px;border-radius:999px;font-size:10.5px}
.tag.BUY{color:var(--buy);background:rgba(40,224,164,.14)} .tag.SELL{color:var(--sell);background:rgba(255,93,120,.14)}
.st{font-size:10.5px;color:var(--mut)}
.xbtn{font-size:11px;font-weight:800;color:var(--sell);background:rgba(255,93,120,.1);border:1px solid rgba(255,93,120,.3);border-radius:7px;padding:5px 9px;cursor:pointer}
.empty{color:var(--dim);font-size:12.5px;text-align:center;padding:14px}
.noexp{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;margin:-2px 0 13px;font-size:12px;color:var(--mut)}
.noexp input{display:none}
.noexp .tk{width:38px;height:22px;border-radius:99px;background:rgba(255,255,255,.1);position:relative;transition:.2s;border:1px solid var(--line);flex:none}
.noexp .tk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#c8d2ee;transition:.2s}
.noexp input:checked + .tk{background:linear-gradient(90deg,var(--acc),var(--buy));box-shadow:0 0 12px -3px rgba(40,224,164,.6)}
.noexp input:checked + .tk::after{left:18px;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">E</div><div><h1>Manual Trading</h1><div class="sub" id="sub">CoinW · UNPUSDT · accounts 1 & 2</div></div></div>
    <div class="ticker" id="ticker"><span class="chip">connecting…</span></div>
  </header>
  <div class="warn" id="mktwarn" style="display:none"></div>
  <div class="accs" id="accs"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const api=(p,m,b)=>fetch(p,{method:m||'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const fmt=(n,d=5)=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const fv=o=>+((o&&(o.free??o.available))||0);
let LAST=null, side={1:'BUY',2:'SELL'};

function accCard(n){
  return `<div class="card" id="acc${n}">
    <h2>Account ${n} <span class="badge">uid slot ${n}</span></h2>
    <div class="bal">
      <div class="asset"><div class="k">UNP</div><div class="v" id="unp${n}">–</div><div class="lk" id="unpl${n}"></div></div>
      <div class="asset"><div class="k">USDT</div><div class="v" id="usdt${n}">–</div><div class="lk" id="usdtl${n}"></div></div>
    </div>
    <div class="seg">
      <button class="buy on" data-a="${n}" data-s="BUY">Buy</button>
      <button class="sell" data-a="${n}" data-s="SELL">Sell</button>
    </div>
    <div class="row">
      <div class="fld"><label>Price (USDT) <button class="mini" data-fill="${n}">use last</button></label><input id="price${n}" placeholder="0.10650"></div>
      <div class="fld"><label>Quantity (UNP)</label><input id="qty${n}" placeholder="50"></div>
    </div>
    <div class="fld"><label>Expire (seconds)</label><input id="exp${n}" value="60"></div>
    <label class="noexp"><input type="checkbox" id="noexp${n}"><span class="tk"></span>
      <span>No expiry — order never auto-cancels (rests until filled or you cancel it)</span></label>
    <button class="send buy" id="send${n}" data-a="${n}">Buy UNP</button>
    <div class="msg" id="msg${n}"></div>
    <div class="ohead"><h3>Open orders</h3><button class="cancelall" data-a="${n}">Cancel all</button></div>
    <div class="olist" id="olist${n}"><div class="empty">—</div></div>
  </div>`;
}
$('#accs').innerHTML=accCard(1)+accCard(2);

function setSide(n,s){
  side[n]=s;
  document.querySelectorAll(`.seg button[data-a="${n}"]`).forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  const btn=$('#send'+n);
  btn.className='send '+(s==='BUY'?'buy':'sell'); btn.textContent=(s==='BUY'?'Buy UNP':'Sell UNP');
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setSide(+b.dataset.a,b.dataset.s));
document.querySelectorAll('.mini').forEach(b=>b.onclick=()=>{if(LAST?.market?.last)$('#price'+b.dataset.fill).value=LAST.market.last;});
[1,2].forEach(n=>{const cb=$('#noexp'+n);cb.onchange=()=>{const e=$('#exp'+n);e.disabled=cb.checked;e.style.opacity=cb.checked?.4:1;};});

const NO_EXPIRE=3153600000;   // ~100 years => order never auto-cancels
async function send(n){
  const price=$('#price'+n).value.trim(), qty=$('#qty'+n).value.trim(), s=side[n];
  const noexp=$('#noexp'+n).checked;
  const exp=noexp?NO_EXPIRE:(+$('#exp'+n).value||60);
  const m=$('#msg'+n);
  if(!price||!qty){m.className='msg err';m.textContent='enter price and quantity';return;}
  const val=(+price)*(+qty);
  const last=+(LAST?.market?.last||0);
  let note=`${s} ${qty} UNP @ ${price}  (≈ ${val.toFixed(2)} USDT) on account ${n}`
    +(noexp?'\n\nNO EXPIRY — this order stays open until it fills or you cancel it.':'');
  if(last>0 && Math.abs(+price-last)/last>0.3) note+=`\n\n⚠ price ${price} is far from last market ${last}. Continue?`;
  if(!confirm(note))return;
  m.className='msg';m.textContent='sending…';
  const r=await api('/api/send','POST',{account:n,side:s,price,quantity:qty,expire:exp});
  if(r.ok){m.className='msg ok';m.textContent=`✓ ${s} placed · id ${(r.id||'').slice(0,8)}`;}
  else{m.className='msg err';m.textContent='✗ '+(r.error||'failed');}
  tick();
}
document.querySelectorAll('.send').forEach(b=>b.onclick=()=>send(+b.dataset.a));

async function cancel(id,n){const r=await api('/api/cancel','POST',{id});const m=$('#msg'+n);
  m.className='msg '+(r.ok?'ok':'err');m.textContent=r.ok?'✓ cancelled':'✗ '+(r.error||'failed');tick();}
async function cancelAll(n){if(!confirm(`Cancel ALL open orders on account ${n}?`))return;
  const r=await api('/api/cancelall','POST',{account:n});const m=$('#msg'+n);
  m.className='msg '+(r.ok?'ok':'err');m.textContent=r.ok?'✓ all cancelled':'✗ '+(r.error||'nothing to cancel');tick();}
document.querySelectorAll('.cancelall').forEach(b=>b.onclick=()=>cancelAll(+b.dataset.a));

function renderOrders(n,orders){
  const mine=orders.filter(o=>+o.account===n && o.status==='open');
  const el=$('#olist'+n);
  if(!mine.length){el.innerHTML='<div class="empty">no open orders</div>';return;}
  el.innerHTML=mine.map(o=>`<div class="oitem">
    <span class="tag ${o.side}">${o.side}</span>
    <span>@ ${fmt(o.price,5)}</span>
    <span>${fmt(o.quantity,2)} UNP</span>
    <button class="xbtn" data-id="${o.id}" data-a="${n}">Cancel</button>
  </div>`).join('');
  el.querySelectorAll('.xbtn').forEach(b=>b.onclick=()=>cancel(b.dataset.id,+b.dataset.a));
}

async function tick(){
  let s;try{s=await api('/api/state');}catch{return;}
  LAST=s;
  if(s.exchange)$('#sub').textContent=`${s.exchange} · UNPUSDT · accounts 1 & 2`;
  const m=s.market||{};
  $('#ticker').innerHTML=m.last?`<span class="chip">last <b>${m.last}</b></span>
    <span class="chip">bid <b class="g">${m.bid}</b></span><span class="chip">ask <b class="r">${m.ask}</b></span>
    <span class="chip">24h <b>${m.low}</b>–<b>${m.high}</b></span>`:'<span class="chip">market n/a</span>';
  // warn if market looks distorted (last far from 24h low)
  const w=$('#mktwarn');
  if(m.last && m.low && (+m.last)/(+m.low)>3){w.style.display='block';
    w.textContent=`⚠ CoinW price looks distorted: last ${m.last} vs 24h-low ${m.low}. Orders near the real price may be rejected by CoinW's price band until the book settles.`;}
  else w.style.display='none';
  const accs=(s.balances&&s.balances.accounts)||{};
  const orders=(s.orders&&s.orders.orders)||[];
  [1,2].forEach(n=>{
    const a=accs[String(n)]?.assets||{};
    $('#unp'+n).textContent=fmt(fv(a.UNP),2); $('#usdt'+n).textContent=fmt(fv(a.USDT),2);
    $('#unpl'+n).textContent=(+((a.UNP?.locked)||0))?`locked ${fmt(a.UNP.locked,2)}`:'';
    $('#usdtl'+n).textContent=(+((a.USDT?.locked)||0))?`locked ${fmt(a.USDT.locked,2)}`:'';
    renderOrders(n,orders);
  });
}
setSide(1,'BUY'); setSide(2,'SELL');
tick(); setInterval(tick,3000);
</script>
</body>
</html>
